          </div>
        </div>

        ${hasRosters ? `
        <div class="history-roster-grid">
          ${playerResults.map(pr => {
            const roster = pr.roster;
            const picks = roster?.picks || [];
            const alt = roster?.alternate || '';

            return `
              <div class="history-player-cell">
                <div class="history-player-name">
                  <div style="display:flex;align-items:center;gap:8px">
                    <span>${pr.player}</span>
                    ${(() => {
                      const mData = state.majors[major.id];
                      const roster = mData?.rosters[pr.player];
                      const picks = roster?.picks || [];
                      let teamTotal = null;
                      picks.forEach(g => {
                        if (!g) return;
                        const espn = espnData[major.id]?.[g.toLowerCase()];
                        if (!espn) return;
                        const ls = espn.linescores || espn.raw?.linescores || [];
                        if (!ls.length) return;
                        const s = ls.slice(0,4).reduce((sum,r) => { const d=String(r.displayValue??'').trim(); const n=d==='E'?0:parseInt(d); return sum+(isNaN(n)?0:(Math.abs(n)>20?n-72:n)); }, 0);
                        teamTotal = (teamTotal||0) + s;
                      });
                      if (teamTotal === null) return '';
                      const cls = teamTotal < 0 ? 'score-under' : teamTotal > 0 ? 'score-over' : 'score-even';
                      const str = teamTotal === 0 ? 'E' : (teamTotal > 0 ? '+' : '') + teamTotal;
                      return `<span class="${cls}" style="font-family:'DM Mono',monospace;font-size:0.82rem;font-weight:700">${str}</span>`;
                    })()}
                  </div>
                  <span class="history-player-banked ${pr.net > 0 ? 'amount-positive' : pr.net < 0 ? 'amount-negative' : ''}">${pr.net > 0 ? '+' : ''}$${Math.abs(pr.net).toFixed(2)}</span>
                </div>
                <div class="history-player-picks">
                  ${picks.map(g => {
                    if (!g) return '';
                    const st = mData.statuses[g] || 'active';
                    const isCut = st === 'missed_cut' || st === 'withdrawn';
                    const isWinner = mData.majorWinner === g;
                    const espnG = espnData[major.id]?.[g.toLowerCase()];
                    // Calculate total from round linescores for accuracy
                    const gLS = espnG?.linescores || espnG?.raw?.linescores || [];
                    let scoreStr = '–';
                    if (espnG) {
                      if (gLS.length > 0) {
                        const sum = gLS.slice(0,4).reduce((s,r) => { const d=String(r.displayValue??'').trim(); const n=d==='E'?0:parseInt(d); return s+(isNaN(n)?0:(Math.abs(n)>20?n-72:n)); }, 0);
                        scoreStr = sum===0?'E':(sum>0?'+'+sum:''+sum);
                      } else {
                        scoreStr = espnG.score || '–';
                      }
                    }
                    const scoreCls = scoreStr.startsWith('-') ? 'score-under' : scoreStr.startsWith('+') ? 'score-over' : scoreStr === 'E' ? 'score-even' : '';
                    return `
                      <div class="history-pick-row">
                        <span class="history-pick-name ${isCut ? 'cut' : isWinner ? 'winner-pick' : ''}">${isWinner ? '🏆 ' : ''}${g}${isCut ? ' (MC)' : ''}</span>
                        <span class="history-pick-score ${scoreCls}">${scoreStr}</span>
                      </div>
                    `;
                  }).join('')}
                  ${alt ? (() => {
                    const altEspn = espnData[major.id]?.[alt.toLowerCase()];
                    const altLS = altEspn?.linescores || altEspn?.raw?.linescores || [];
                    let altScore = '–';
                    if (altEspn) {
                      if (altLS.length > 0) {
                        const sum = altLS.slice(0,4).reduce((s,r) => { const d=String(r.displayValue??'').trim(); const n=d==='E'?0:parseInt(d); return s+(isNaN(n)?0:(Math.abs(n)>20?n-72:n)); }, 0);
                        altScore = sum===0?'E':(sum>0?'+'+sum:''+sum);
                      } else { altScore = altEspn.score || '–'; }
                    }
                    const altCls = altScore.startsWith('-')?'score-under':altScore.startsWith('+')?'score-over':altScore==='E'?'score-even':'';
                    return `<div class="history-pick-row" style="margin-top:3px;opacity:0.6">
                      <span class="history-pick-name" style="font-style:italic">ALT: ${alt}</span>
                      <span class="history-pick-score ${altCls}">${altScore}</span>
                    </div>`;
                  })() : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
        ` : `<div style="padding:20px 24px;font-family:'DM Mono',monospace;font-size:0.72rem;color:rgba(200,200,200,0.3)">No roster data recorded</div>`}
      </div>
    `;
  });

  el.innerHTML = html;
}

// GOLFER AUTOCOMPLETE

let fieldCache = {}; // majorId -> [golfer names]
let activeDropdown = null;

async function fetchField(majorId) {
  if (fieldCache[majorId]?.length > 0) return fieldCache[majorId];
  const major = MAJORS.find(m => m.id === majorId);
  if (!major?.espnId) return [];
  try {
    const url = `https://site.api.espn.com/apis/site/v2/sports/golf/leaderboard?event=${major.espnId}`;
    const r = await fetch(url);
    const j = await r.json();
    const competitors = j?.events?.[0]?.competitions?.[0]?.competitors || [];
    const names = competitors.map(c => c.athlete?.displayName || '').filter(Boolean).sort();
    if (names.length > 0) fieldCache[majorId] = names;
    return fieldCache[majorId] || [];
  } catch(e) {
    console.warn('fetchField failed:', e);
    return [];
  }
}


function closeAllDropdowns() {
  document.querySelectorAll('.autocomplete-dropdown').forEach(d => d.remove());
  activeDropdown = null;
}

function highlightMatch(name, query) {
  if (!query) return name;
  let result = name;
  const words = query.trim().split(' ').filter(Boolean);
  words.forEach(word => {
    const re = new RegExp('(' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    result = result.replace(re, '<em>$1</em>');
  });
  return result;
}

function showDropdown(input, player, slot) {
  const query = input.value.trim();
  closeAllDropdowns();
  updatePick(player, slot, query);

  const names = fieldCache[activeMajorId] || [];
  if (query.length < 1 || names.length === 0) return;

  const q = query.toLowerCase();
  const words = q.split(' ').filter(Boolean);
  const scoreMatch = name => {
    const n = name.toLowerCase();
    const parts = n.split(' ');
    if (n.startsWith(q)) return 0;
    if (parts.some(p => p.startsWith(q))) return 1;
    if (words.every(w => n.includes(w))) return 2;
    if (n.includes(q)) return 3;
    return 99;
  };
  const matches = names
    .map(n => ({ n, s: scoreMatch(n) }))
    .filter(x => x.s < 99)
    .sort((a, b) => a.s - b.s || a.n.localeCompare(b.n))
    .slice(0, 8)
    .map(x => x.n);

  if (matches.length === 0) return;

  const wrap = input.closest('.autocomplete-wrap');
  if (!wrap) return;

  const dropdown = document.createElement('div');
  dropdown.className = 'autocomplete-dropdown';
  matches.forEach(name => {
    const item = document.createElement('div');
    item.className = 'autocomplete-item';
    item.innerHTML = highlightMatch(name, query);
    const select = e => {
      e.preventDefault();
      e.stopPropagation();
      input.value = name;
      updatePick(player, slot, name);
      closeAllDropdowns();
    };
    item.addEventListener('mousedown', select);
    item.addEventListener('touchstart', select, { passive: false });
    dropdown.appendChild(item);
  });

  wrap.appendChild(dropdown);
  activeDropdown = dropdown;
}

async function handleRosterInput(input, player, slot) {
  updatePick(player, slot, input.value.trim());
  if (input.value.trim().length < 1) { closeAllDropdowns(); return; }

  if (fieldCache[activeMajorId]?.length > 0) {
    showDropdown(input, player, slot);
    return;
  }

  // Fetch from ESPN then show
  closeAllDropdowns();
  const wrap = input.closest('.autocomplete-wrap');
  if (!wrap) return;
  const loadingEl = document.createElement('div');
  loadingEl.className = 'autocomplete-dropdown';
  loadingEl.innerHTML = '<div class="autocomplete-loading"><span class="loading-spinner"></span> Loading field from ESPN…</div>';
  wrap.appendChild(loadingEl);

  await fetchField(activeMajorId);
  loadingEl.remove();

  if (document.body.contains(input) && input.value.trim().length > 0) {
    showDropdown(input, player, slot);
  }
}

// STANDINGS TAB
// ══════════════════════════════════════════
const YEARS = [2026]; // add future years here

function renderStandings() {
  if (!state) return;
  const el = document.getElementById('mainContent');

  // Year selector
  const yearTabs = YEARS.map(y => `
    <button class="year-tab${y === activeStandingsYear ? ' active' : ''}" onclick="activeStandingsYear=${y};renderStandings()">
      ${y}
    </button>
  `).join('');

  // Filter majors for selected year
  const yearMajors = MAJORS.filter(m => m.year === activeStandingsYear);

  // Build totals
  const totals = {};
  PLAYERS.forEach(p => { totals[p] = { net: 0, majors: {}, paid: 0, won: 0 }; });

  yearMajors.forEach(m => {
    const mData = state.majors[m.id];
    const pot = calcPot(m.id);
    // Only count majors that have been played (have a winner or are marked complete)
    const hasBeenPlayed = mData.complete || mData.majorWinner || mData.teamWinner ||
      Object.values(mData.statuses || {}).some(s => s === 'missed_cut');
    PLAYERS.forEach(p => {
      if (!hasBeenPlayed) {
        totals[p].majors[m.id] = null;
        return;
      }
      const paid = 20 + (mData.potExtra[p] || 0) * 5;
      let won = 0;
      const twSplit = mData.teamWinner ? mData.teamWinner.split(',').map(s=>s.trim()) : [];
      if (twSplit.includes(p)) won += Math.round(pot.half / twSplit.length * 100) / 100;
      const roster = mData.rosters[p];
      if (mData.majorWinner && roster?.picks?.includes(mData.majorWinner)) won += pot.half;
      const net = won - paid;
      totals[p].net += net;
      totals[p].paid += paid;
      totals[p].won += won;
      totals[p].majors[m.id] = { net, paid, won };
    });
  });

  const sorted = PLAYERS.slice().sort((a, b) => totals[b].net - totals[a].net);

  let html = `
    <div class="standings-hero">
      <div>
        <div style="font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:var(--gold)">Season Standings</div>
        <div style="font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--gold-light);opacity:0.7;margin-top:4px;letter-spacing:0.08em">Franktown Golf Majors · All-Time</div>
      </div>
      <div class="year-tabs">${yearTabs}</div>
    </div>

    <div class="standings-card" style="margin-bottom:28px">
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
      <table class="overall-table">
        <thead>
          <tr>
            <th style="text-align:left;padding-left:16px">Player</th>
            ${yearMajors.map(m => `<th class="major-col-header">${m.name.replace('The ','').replace(' Championship','')}<br><span style="opacity:0.5;font-size:0.5rem">${m.dates}</span></th>`).join('')}
            <th>Paid In</th>
            <th>Won</th>
            <th style="color:var(--gold)">Net</th>
          </tr>
        </thead>
        <tbody>
          ${sorted.map((p, i) => {
            const t = totals[p];
            const isLeader = i === 0 && t.net !== 0;
            return `<tr${isLeader ? ' style="background:rgba(201,168,76,0.06)"' : ''}>
              <td style="text-align:left;padding-left:16px;font-weight:700">
                ${isLeader ? '🥇 ' : ''}${p}
              </td>
              ${yearMajors.map(m => {
                const v = t.majors[m.id];
                if (!v) return '<td class="major-col" style="color:rgba(200,200,200,0.2)">–</td>';
                const cls = v.net > 0 ? 'amount-positive' : v.net < 0 ? 'amount-negative' : '';
                return `<td class="major-col ${cls}">${v.net > 0 ? '+$' : v.net < 0 ? '-$' : '$'}${Math.abs(v.net).toFixed(2)}</td>`;
              }).join('')}
              <td class="paid-col" style="color:rgba(200,200,200,0.5)">$${t.paid.toFixed(2)}</td>
              <td class="won-col ${t.won > 0 ? 'amount-positive' : ''}">${t.won > 0 ? '+' : ''}$${t.won.toFixed(2)}</td>
              <td class="${t.net > 0 ? 'amount-positive' : t.net < 0 ? 'amount-negative' : ''}" style="font-weight:700;font-size:0.9rem">${t.net > 0 ? '+$' : t.net < 0 ? '-$' : '$'}${Math.abs(t.net).toFixed(2)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;

  el.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function saveScoreSnapshot() {
  const majorId = activeMajorId;
  const scores = espnData[majorId];
  if (!scores || Object.keys(scores).length === 0) {
    showToast('No ESPN data loaded — tap Refresh first');
    return;
  }
  if (!state?.majors?.[majorId]) return;
  state.majors[majorId].scoreSnapshot = {};
  Object.entries(scores).forEach(([k, v]) => {
    state.majors[majorId].scoreSnapshot[k] = {
      score: v.score, toPar: v.toPar, thru: v.thru,
      linescores: v.raw?.linescores || [], flagUrl: v.flagUrl, country: v.country
    };
  });
  syncPush();
  showToast('Score snapshot saved ✓');
}

function debugESPN() {
  const el = document.getElementById('espnDebugOut');
  if (!el) return;
  const data = espnData[activeMajorId];
  if (!data || Object.keys(data).length === 0) {
    el.textContent = 'No ESPN data loaded yet. Try clicking Refresh first.';
  } else {
    const lines = Object.entries(data).map(([k, v]) =>
      `${k.padEnd(30)} | score:${String(v.score).padEnd(5)} | thru:${String(v.thru).padEnd(8)} | teeTime:${v.teeTime || 'none'}`
    );
    el.textContent = `${lines.length} players loaded:\n\n` + lines.join('\n');
  }
  el.style.display = 'block';
}

function debugField() {
  const el = document.getElementById('espnDebugOut');
  if (!el) return;
  const field = fieldCache[activeMajorId];
  if (!field?.length) {
    el.textContent = 'Field cache empty. Open autocomplete or click Refresh.';
  } else {
    el.textContent = `${field.length} players in field cache:\n\n` + field.join('\n');
  }
  el.style.display = 'block';
}

function clearESPNCache() {
  delete fieldCache[activeMajorId];
  delete espnData[activeMajorId];
  lastESPNFetch = 0;
  fetchESPN(activeMajorId).catch(() => {});
  fetchField(activeMajorId).then(() => {
    const el = document.getElementById('espnDebugOut');
    if (el) { el.textContent = 'Cache cleared and refetched. Click Dump ESPN Data to see results.'; el.style.display = 'block'; }
  });
}

// ══════════════════════════════════════════
// VISIBILITY — re-fetch instantly when tab regains focus
// ══════════════════════════════════════════
let lastESPNFetch = 0;
const ESPN_DEBOUNCE = 8000;

const _origFetchESPN = fetchESPN;
fetchESPN = async function(majorId) {
  const now = Date.now();
  if (now - lastESPNFetch < ESPN_DEBOUNCE) return;
  lastESPNFetch = now;
  return _origFetchESPN(majorId);
};

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    // Restart polling in case browser throttled/killed timers while hidden
    startPolling();
    // Force immediate fresh pull from JSONBin
    syncPull().catch(() => {});
    // Reset ESPN debounce so scores refresh immediately
    lastESPNFetch = 0;
    fetchESPN(activeMajorId).catch(() => {});
  }
});
window.addEventListener('focus', () => {
  startPolling();
  syncPull().catch(() => {});
  lastESPNFetch = 0;
  fetchESPN(activeMajorId).catch(() => {});
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closePlayerModal();
    if (adminUnlocked) closeAdmin();
  }
});
