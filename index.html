<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Franktown Golf Majors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #1a2e1a;
    --green-mid: #2d4a2d;
    --green-light: #3d6b3d;
    --green-fade: #4a7c4a;
    --gold: #c9a84c;
    --gold-light: #e0c070;
    --gold-pale: #f5e8c0;
    --cream: #faf6ed;
    --cream-dark: #f0e8d5;
    --white: #ffffff;
    --text-dark: #1a1a1a;
    --text-mid: #3a3a3a;
    --text-light: #6a6a6a;
    --red: #8b2020;
    --red-light: #c0392b;
    --border: rgba(201,168,76,0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    scroll-padding-top: 110px; /* header + tabs height */
  }

  body {
    font-family: 'Libre Baskerville', Georgia, serif;
    background: var(--green-deep);
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  .site-header {
    background: var(--green-deep);
    border-bottom: 2px solid var(--gold);
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .site-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.02em;
    line-height: 1.1;
  }

  .site-subtitle {
    font-size: 0.65rem;
    color: var(--gold-light);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    margin-top: 2px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sync-status {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--gold-light);
    opacity: 0.7;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #888;
    transition: background 0.3s;
  }
  .sync-dot.live { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
  .sync-dot.error { background: var(--red-light); }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 7px 14px;
    border-radius: 3px;
    border: 1px solid;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-gold {
    background: var(--gold);
    color: var(--green-deep);
    border-color: var(--gold);
    font-weight: 500;
  }
  .btn-gold:hover { background: var(--gold-light); border-color: var(--gold-light); }

  .btn-outline {
    background: transparent;
    color: var(--gold);
    border-color: var(--border);
  }
  .btn-outline:hover { border-color: var(--gold); background: rgba(201,168,76,0.08); }

  .btn-sm { padding: 5px 10px; font-size: 0.65rem; }
  .btn-danger { background: var(--red); color: white; border-color: var(--red); }
  .btn-danger:hover { background: var(--red-light); }

  /* ── MAJOR TABS ── */
  .major-tabs {
    background: var(--green-mid);
    border-bottom: 1px solid var(--border);
  }

  .tabs-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    gap: 0;
    overflow-x: auto;
  }

  .tab {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 13px 20px;
    color: var(--gold-light);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    opacity: 0.6;
    transition: all 0.2s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: 'DM Mono', monospace;
  }

  .tab:hover { opacity: 0.9; }
  .tab.active { opacity: 1; border-bottom-color: var(--gold); color: var(--gold); }
  .tab .tab-year { font-size: 0.6rem; opacity: 0.7; display: block; }

  /* ── MAIN ── */
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  /* ── MAJOR HERO ── */
  .major-hero {
    background: linear-gradient(135deg, var(--green-mid) 0%, var(--green-deep) 100%);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 28px 32px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .major-info h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 4px;
  }

  .major-info .major-meta {
    font-size: 0.78rem;
    color: var(--gold-light);
    opacity: 0.8;
    letter-spacing: 0.05em;
    font-family: 'DM Mono', monospace;
  }

  .pot-display {
    text-align: right;
  }

  .pot-amount {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
  }

  .pot-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--gold-light);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-top: 4px;
  }

  .pot-breakdown {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--gold-light);
    opacity: 0.6;
    margin-top: 2px;
  }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 12px;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--gold-light);
    letter-spacing: 0.02em;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 28px 0;
  }

  /* ── LEADERBOARD TABLE ── */
  .lb-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  .lb-table th {
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.7;
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  .lb-table th.num { text-align: center; }

  .lb-table td {
    padding: 11px 12px;
    border-bottom: 1px solid rgba(201,168,76,0.1);
    vertical-align: middle;
    color: var(--cream);
  }

  .lb-table td.num { text-align: center; font-family: 'DM Mono', monospace; }

  .lb-table tr:hover td { background: rgba(201,168,76,0.05); }
  .lb-table tbody tr:active td { background: rgba(201,168,76,0.08); }

  .lb-table tr.leader td { background: rgba(201,168,76,0.08); }
  .lb-table tr.leader td:first-child { border-left: 3px solid var(--gold); }

  .rank-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px; height: 24px;
    border-radius: 50%;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    font-weight: 500;
    background: rgba(201,168,76,0.15);
    color: var(--gold-light);
  }

  .rank-badge.gold { background: var(--gold); color: var(--green-deep); }

  .player-name {
    font-weight: 700;
    color: var(--cream);
    font-size: 0.9rem;
  }

  .golfer-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
  }

  .golfer-pill {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    padding: 3px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    color: var(--gold-light);
    background: rgba(201,168,76,0.07);
    white-space: nowrap;
    -webkit-tap-highlight-color: rgba(201,168,76,0.2);
    user-select: none;
  }
  .golfer-pill:active { background: rgba(201,168,76,0.2); }

  .golfer-pill.missed-cut {
    border-color: rgba(139,32,32,0.4);
    color: rgba(192,57,43,0.8);
    background: rgba(139,32,32,0.1);
    text-decoration: line-through;
  }

  .golfer-pill.withdrawn {
    border-color: rgba(100,100,100,0.4);
    color: rgba(150,150,150,0.8);
    background: rgba(100,100,100,0.1);
    text-decoration: line-through;
  }

  .golfer-pill.winner {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,168,76,0.15);
  }

  .golfer-pill.alternate {
    border-style: dashed;
    opacity: 0.7;
  }

  .score-val {
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    font-weight: 500;
  }

  .score-under { color: #5dcc61; }
  .score-over { color: #ff6b6b; }
  .score-even { color: var(--gold-light); }
  .score-cut { color: rgba(150,150,150,0.6); font-size: 0.75rem; }

  .missed-cut-badge {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(139,32,32,0.2);
    color: rgba(192,57,43,0.9);
    border: 1px solid rgba(139,32,32,0.3);
    margin-left: 4px;
  }

  /* ── GOLFER LEADERBOARD ── */
  .golfer-lb {
    background: var(--green-mid);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .golfer-lb-header {
    padding: 14px 18px;
    background: rgba(0,0,0,0.2);
    border-bottom: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .golfer-row {
    display: flex;
    align-items: center;
    padding: 10px 18px;
    border-bottom: 1px solid rgba(201,168,76,0.08);
    gap: 12px;
    font-size: 0.82rem;
    transition: background 0.15s;
    min-height: 48px;
  }
  .golfer-row:active { background: rgba(201,168,76,0.1); }

  .golfer-row:hover { background: rgba(201,168,76,0.04); }
  .golfer-row:last-child { border-bottom: none; }

  .golfer-pos {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    width: 32px;
    color: var(--gold-light);
    opacity: 0.7;
    flex-shrink: 0;
  }

  .golfer-name-cell {
    flex: 1;
    min-width: 0;
  }

  .golfer-name-main {
    font-weight: 700;
    color: var(--cream);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .golfer-owner {
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    color: var(--gold-light);
    opacity: 0.6;
    margin-top: 2px;
  }

  .golfer-score-cell {
    text-align: right;
    flex-shrink: 0;
  }

  .golfer-total {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-light);
    color: rgba(200,200,200,0.5);
    margin-top: 1px;
  }

  /* ── GRID LAYOUT ── */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 28px;
  }



  /* ── TEAM STANDINGS CARD ── */
  .standings-card {
    background: var(--green-mid);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 28px;
  }

  .standings-card-header {
    padding: 14px 18px;
    background: rgba(0,0,0,0.2);
    border-bottom: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    display: flex;
    justify-content: space-between;
  }

  /* ── ADMIN MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
  }

  .modal {
    background: var(--green-deep);
    border: 1px solid var(--gold);
    border-radius: 8px;
    width: 100%;
    max-width: 720px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--gold);
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--gold-light);
    font-size: 1.4rem;
    cursor: pointer;
    opacity: 0.7;
    line-height: 1;
    padding: 0 4px;
  }
  .modal-close:hover { opacity: 1; }

  .modal-body { padding: 24px; }

  .admin-section {
    margin-bottom: 28px;
  }

  .admin-section h3 {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .form-row {
    display: flex;
    gap: 12px;
    margin-bottom: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
    min-width: 120px;
  }

  .form-group label {
    font-family: 'DM Mono', monospace;
    font-size: 0.63rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold-light);
    opacity: 0.8;
  }

  .form-group input, .form-group select {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 10px;
    color: var(--cream);
    font-family: 'Libre Baskerville', serif;
    font-size: 0.82rem;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .form-group input:focus, .form-group select:focus {
    border-color: var(--gold);
  }

  .form-group select option {
    background: var(--green-deep);
    color: var(--cream);
  }

  .player-roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .player-roster-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 14px;
  }

  .player-roster-name {
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    color: var(--gold);
    margin-bottom: 10px;
    font-weight: 600;
  }

  .roster-inputs {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .roster-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .roster-slot-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    text-transform: uppercase;
    color: var(--gold-light);
    opacity: 0.6;
    width: 20px;
    flex-shrink: 0;
  }

  .roster-input-row input {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 5px 8px;
    color: var(--cream);
    font-size: 0.78rem;
    font-family: 'Libre Baskerville', serif;
    outline: none;
  }
  .roster-input-row input:focus { border-color: var(--gold); }
  .roster-input-row input.alt-input { border-style: dashed; opacity: 0.8; }

  /* ── STATUS CONTROLS ── */
  .status-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  .status-table th {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.7;
    padding: 7px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .status-table td {
    padding: 8px 10px;
    border-bottom: 1px solid rgba(201,168,76,0.08);
    color: var(--cream);
    vertical-align: middle;
  }

  .status-select {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 4px 8px;
    color: var(--cream);
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    outline: none;
    cursor: pointer;
  }
  .status-select:focus { border-color: var(--gold); }
  .status-select option { background: var(--green-deep); }

  /* ── PASSWORD ── */
  .pw-gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 20px 0;
  }

  .pw-gate p {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--gold-light);
    opacity: 0.8;
    letter-spacing: 0.06em;
  }

  .pw-gate input {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 14px;
    color: var(--cream);
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    outline: none;
    width: 220px;
    text-align: center;
  }
  .pw-gate input:focus { border-color: var(--gold); }

  .pw-error {
    color: var(--red-light);
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--green-mid);
    border: 1px solid var(--gold);
    border-radius: 5px;
    padding: 12px 18px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--gold-light);
    z-index: 500;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    opacity: 0.5;
  }

  .empty-state p {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    color: var(--gold-light);
  }

  /* ── LOADING ── */
  .loading-spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(201,168,76,0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── WINNER BANNER ── */
  .winner-banner {
    background: linear-gradient(135deg, rgba(201,168,76,0.2), rgba(201,168,76,0.05));
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 18px 24px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .winner-trophy { font-size: 2rem; }

  .winner-text h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--gold);
    margin-bottom: 2px;
  }

  .winner-text p {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--gold-light);
    opacity: 0.8;
  }

  /* ── STANDINGS ACROSS MAJORS ── */
  .overall-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  .overall-table th {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.7;
    padding: 8px 12px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .overall-table th:first-child { text-align: left; }

  .overall-table td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(201,168,76,0.08);
    text-align: center;
    vertical-align: middle;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    color: var(--cream);
  }
  .overall-table td:first-child { text-align: left; font-family: 'Libre Baskerville', serif; font-weight: 700; }

  .major-col-header {
    font-size: 0.55rem !important;
  }

  .amount-positive { color: #4caf50; }
  .amount-negative { color: var(--red-light); }

  /* ── ROUND INDICATOR ── */
  .round-badge {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    padding: 3px 8px;
    border-radius: 10px;
    text-transform: uppercase;
  }
  .round-upcoming { background: rgba(100,100,100,0.2); color: #aaa; border: 1px solid rgba(100,100,100,0.3); }
  .round-live { background: rgba(76,175,80,0.15); color: #4caf50; border: 1px solid rgba(76,175,80,0.3); animation: pulse 2s infinite; }
  .round-complete { background: rgba(201,168,76,0.1); color: var(--gold-light); border: 1px solid var(--border); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

  /* ── HISTORY TAB ── */
  .history-major-block {
    background: var(--green-mid);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .history-major-header {
    padding: 18px 24px;
    background: rgba(0,0,0,0.2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .history-major-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--gold);
    font-weight: 700;
  }

  .history-major-meta {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--gold-light);
    opacity: 0.7;
    letter-spacing: 0.08em;
  }

  .history-winner-strip {
    display: flex;
    gap: 24px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(201,168,76,0.06);
    flex-wrap: wrap;
    align-items: center;
  }

  .history-winner-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .history-winner-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--gold-light);
    opacity: 0.6;
  }

  .history-winner-value {
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    color: var(--gold);
    font-weight: 600;
  }

  .history-roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 0;
  }

  .history-player-cell {
    padding: 16px 20px;
    border-right: 1px solid rgba(201,168,76,0.1);
    border-bottom: 1px solid rgba(201,168,76,0.1);
    background: rgba(0,0,0,0.15);
  }

  .history-player-cell:nth-child(even) { border-right: none; }

  .history-player-name {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--cream);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .history-player-banked {
    font-family: 'DM Mono', monospace;
    font-size: 0.82rem;
  }

  .history-player-picks {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .history-pick-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.8rem;
    padding: 2px 0;
  }

  .history-pick-name {
    font-family: 'Libre Baskerville', serif;
    color: var(--cream);
  }

  .history-pick-name.cut {
    text-decoration: line-through;
    opacity: 0.5;
    color: rgba(220,120,100,0.9);
  }

  .history-pick-name.winner-pick {
    color: var(--gold);
    font-weight: 700;
  }

  .history-pick-score {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    font-weight: 600;
  }

  .history-empty {
    text-align: center;
    padding: 64px 24px;
  }

  .history-empty-icon {
    font-size: 2.5rem;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  .history-empty-text {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--gold-light);
    opacity: 0.5;
    letter-spacing: 0.06em;
  }

  /* ── PLAYER CARD MODAL ── */
  .player-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(6px);
  }

  .player-modal {
    background: var(--green-deep);
    border: 1px solid var(--gold);
    border-radius: 10px;
    width: 100%;
    max-width: 760px;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7);
  }

  .player-modal-header {
    padding: 22px 26px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 0;
    background: var(--green-deep);
    z-index: 10;
  }

  .player-modal-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--gold);
    line-height: 1.1;
  }

  .player-modal-meta {
    display: flex;
    gap: 14px;
    margin-top: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .player-modal-stat {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--gold-light);
    opacity: 0.8;
  }

  .player-modal-stat strong {
    color: var(--cream);
    font-size: 0.85rem;
  }

  .player-modal-score-big {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    line-height: 1;
  }

  .player-modal-close {
    background: none;
    border: none;
    color: var(--gold-light);
    font-size: 1.5rem;
    cursor: pointer;
    opacity: 0.6;
    line-height: 1;
    padding: 0 4px;
    flex-shrink: 0;
  }
  .player-modal-close:hover { opacity: 1; }

  .player-modal-body { padding: 20px 26px 26px; }

  .scorecard-round {
    margin-bottom: 22px;
  }

  .scorecard-round-title {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.8;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .scorecard-round-total {
    font-size: 0.8rem;
    opacity: 1;
  }

  .scorecard-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    overflow: hidden;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  .scorecard-table th {
    background: rgba(0,0,0,0.25);
    color: var(--gold-light);
    opacity: 0.7;
    padding: 6px 8px;
    text-align: center;
    font-size: 0.6rem;
    letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid rgba(201,168,76,0.1);
  }

  .scorecard-table th:first-child { text-align: left; padding-left: 12px; }

  .scorecard-table td {
    padding: 7px 8px;
    text-align: center;
    border-right: 1px solid rgba(201,168,76,0.08);
    color: var(--cream);
    border-bottom: 1px solid rgba(201,168,76,0.06);
  }

  .scorecard-table td:first-child { text-align: left; padding-left: 12px; color: var(--gold-light); opacity: 0.7; }

  .scorecard-table tr:last-child td { border-bottom: none; }

  .score-birdie { color: #4caf50; font-weight: 700; }
  .score-eagle  { color: #00e5ff; font-weight: 700; }
  .score-bogey  { color: #ef5350; }
  .score-double { color: #b71c1c; font-weight: 700; }
  .score-par    { color: var(--cream); opacity: 0.7; }
  .score-hole-E { color: var(--gold-light); }

  .scorecard-half-divider td {
    border-left: 2px solid var(--border);
    font-weight: 700;
    color: var(--gold-light) !important;
    opacity: 1 !important;
    background: rgba(0,0,0,0.1);
  }

  .player-card-owner-badge {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    padding: 3px 8px;
    border-radius: 10px;
    background: rgba(201,168,76,0.12);
    border: 1px solid var(--border);
    color: var(--gold-light);
    letter-spacing: 0.06em;
  }

  .player-card-loading {
    text-align: center;
    padding: 48px 24px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--gold-light);
    opacity: 0.6;
  }

  .scorecard-no-data {
    text-align: center;
    padding: 28px;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: rgba(200,200,200,0.3);
  }

  /* par indicators in header row */
  .sc-par-row th { opacity: 0.45; font-size: 0.58rem; }




  /* ══════════════════════════════════════════
     RESPONSIVE — TABLET (≤900px)
  ══════════════════════════════════════════ */
  @media (max-width: 900px) {
    .two-col { grid-template-columns: 1fr; }
    .player-roster-grid { grid-template-columns: 1fr 1fr; }
    .overall-table { font-size: 0.72rem; }
    .overall-table th, .overall-table td { padding: 8px 8px; }
  }

  /* ══════════════════════════════════════════
     RESPONSIVE — MOBILE (≤768px)
  ══════════════════════════════════════════ */
  @media (max-width: 768px) {

    /* Header */
    .header-inner {
      flex-direction: row;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px;
    }
    .site-title { font-size: 1.2rem; }
    .site-subtitle { font-size: 0.6rem; }
    .header-right { gap: 8px; }
    .sync-status span { display: none; } /* hide "Live" text, keep dot */

    /* Major tabs — horizontally scrollable */
    .tabs-inner { gap: 0; padding: 0 10px; }
    .tab { font-size: 0.62rem; padding: 10px 12px; letter-spacing: 0.06em; }
    .tab .tab-year { font-size: 0.52rem; }

    /* Main padding */
    .main { padding: 16px 12px; }

    /* Major hero */
    .major-hero {
      flex-direction: column;
      align-items: flex-start;
      padding: 18px 16px;
      gap: 14px;
    }
    .major-info h2 { font-size: 1.3rem; }
    .major-info .major-meta { font-size: 0.68rem; }
    .pot-display { text-align: left; }
    .pot-amount { font-size: 1.8rem; }

    /* Winner banners */
    .winner-banner { padding: 14px 16px; gap: 12px; }
    .winner-trophy { font-size: 1.5rem; }
    .winner-text h3 { font-size: 0.9rem; }
    .winner-text p { font-size: 0.65rem; }

    /* Section headers */
    .section-title { font-size: 0.95rem; }

    /* Team standings table — hide Cuts/Pot Add cols, show inline */
    .lb-table th, .lb-table td { padding: 9px 8px; }
    .lb-table th:nth-child(4),
    .lb-table td:nth-child(4),
    .lb-table th:nth-child(5),
    .lb-table td:nth-child(5) { display: none; }

    /* Season standings — hide per-major cols on mobile, keep player + net */
    .overall-table .major-col, .overall-table .paid-col, .overall-table .won-col { display: none; }
    .overall-table th, .overall-table td { padding: 12px 14px; font-size: 0.88rem; }
    .overall-table { font-size: 0.88rem; }
    .player-name { font-size: 0.82rem; }
    .golfer-pill { font-size: 0.55rem; padding: 2px 5px; }

    /* Golfer leaderboard rows */
    .golfer-row { padding: 9px 12px; gap: 8px; }
    .golfer-name-main { font-size: 0.82rem; }
    .golfer-owner { font-size: 0.55rem; }

    /* Overall standings table */
    .standings-card { overflow-x: auto; }
    .overall-table { font-size: 0.68rem; min-width: 480px; }
    .overall-table th, .overall-table td { padding: 7px 7px; }
    .major-col-header { font-size: 0.5rem !important; }

    /* Make standings card scrollable horizontally */
    .standings-card-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    /* Two-col grids collapse */
    .two-col { grid-template-columns: 1fr; gap: 16px; }

    /* History grid */
    .history-roster-grid { grid-template-columns: 1fr 1fr; }
    .history-player-cell { padding: 10px 12px; }
    .history-winner-strip { padding: 12px 16px; gap: 16px; }
    .history-major-header { padding: 14px 16px; }

    /* Admin modal */
    .modal { max-width: 100%; margin: 10px; border-radius: 8px; }
    .modal-body { padding: 16px; }
    .player-roster-grid { grid-template-columns: 1fr; }
    .form-row { flex-direction: column; gap: 10px; }

    /* Dividers */
    .divider { margin: 20px 0; }
  }

  /* ══════════════════════════════════════════
     RESPONSIVE — SMALL MOBILE (≤480px)
  ══════════════════════════════════════════ */
  @media (max-width: 480px) {
    .main { padding: 12px 10px; }

    /* Header tighter */
    .site-title { font-size: 1.05rem; }
    .btn-sm { padding: 5px 8px; font-size: 0.62rem; }

    /* Major hero */
    .major-info h2 { font-size: 1.15rem; }
    .pot-amount { font-size: 1.5rem; }

    /* Hide score column label on very small screens, keep value */
    .lb-table th:nth-child(3) { font-size: 0.55rem; }

    /* Golfer pills wrap tightly */
    .golfer-pills { gap: 3px; }
    .golfer-pill { font-size: 0.5rem; padding: 1px 4px; }

    /* History grid single column */
    .history-roster-grid { grid-template-columns: 1fr; }
    .history-player-cell { border-right: none; }

    /* Scorecard table horizontal scroll */
    .scorecard-round { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .scorecard-table { min-width: 520px; font-size: 0.6rem; }
    .scorecard-table td, .scorecard-table th { padding: 5px 5px; }

    /* Player modal full screen on tiny devices */
    .player-modal-overlay { padding: 0; align-items: flex-end; }
    .player-modal {
      max-width: 100%;
      max-height: 92vh;
      border-radius: 12px 12px 0 0;
      border-bottom: none;
    }
    .player-modal-header { padding: 16px 16px 12px; }
    .player-modal-name { font-size: 1.1rem; }
    .player-modal-score-big { font-size: 1.5rem; }
    .player-modal-body { padding: 14px 16px 24px; }

    /* Overall season standings scrollable */
    .season-standings-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    /* Pot breakdown wraps */
    .pot-breakdown { font-size: 0.6rem; }

    /* Round summary strip in player card */
    .summary-strip { gap: 10px; }

    /* Admin roster grid single col */
    .player-roster-grid { grid-template-columns: 1fr; }

    /* Status table font */
    .status-table { font-size: 0.75rem; }
    .status-table th, .status-table td { padding: 6px 8px; }
  }


  /* ── AUTOCOMPLETE ── */
  .autocomplete-wrap {
    position: relative;
    flex: 1;
  }

  .autocomplete-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--green-deep);
    border: 1px solid var(--gold);
    border-top: none;
    border-radius: 0 0 4px 4px;
    max-height: 180px;
    overflow-y: auto;
    z-index: 400;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }

  .autocomplete-item {
    padding: 8px 12px;
    font-family: 'Libre Baskerville', serif;
    font-size: 0.8rem;
    color: var(--cream);
    cursor: pointer;
    border-bottom: 1px solid rgba(201,168,76,0.08);
    transition: background 0.1s;
  }

  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:hover, .autocomplete-item.selected {
    background: rgba(201,168,76,0.15);
    color: var(--gold);
  }

  .autocomplete-item em {
    font-style: normal;
    color: var(--gold);
    font-weight: 700;
  }

  .autocomplete-loading {
    padding: 10px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--gold-light);
    opacity: 0.6;
  }


  /* ── TEAM CARDS ── */
  .team-cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }

  .team-card {
    background: var(--green-mid);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .team-card-leader {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(201,168,76,0.2);
  }

  .tc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: rgba(0,0,0,0.2);
    border-bottom: 1px solid var(--border);
  }

  .tc-rank-name {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .tc-rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    background: rgba(201,168,76,0.12);
    color: var(--gold-light);
    flex-shrink: 0;
  }

  .tc-rank-gold {
    background: var(--gold);
    color: var(--green-deep);
    font-weight: 700;
  }

  .tc-name {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--cream);
  }

  .tc-total {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tc-score {
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
  }

  .tc-score-dash {
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    color: rgba(200,200,200,0.3);
  }

  .tc-penalty {
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    color: var(--red-light);
    background: rgba(139,32,32,0.15);
    border: 1px solid rgba(139,32,32,0.3);
    border-radius: 4px;
    padding: 2px 5px;
  }

  .tc-golfers {
    padding: 8px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  /* ── GOLFER ROW INSIDE CARD ── */
  .golfer-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px;
    border-radius: 5px;
    background: rgba(255,255,255,0.03);
    border: 1px solid transparent;
    transition: background 0.15s, border-color 0.15s;
    gap: 8px;
  }

  .golfer-card:hover { background: rgba(201,168,76,0.08); border-color: var(--border); }
  .golfer-card:active { background: rgba(201,168,76,0.14); }

  .golfer-card.gc-cut { opacity: 0.5; }
  .golfer-card.gc-wd  { opacity: 0.35; }
  .golfer-card.gc-alt { opacity: 0.55; border-style: dashed; }

  .gc-name-row {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    flex: 1;
    overflow: hidden;
  }

  @media (min-width: 600px) {
    .gc-name {
      white-space: normal !important;
      overflow: visible !important;
      text-overflow: unset !important;
    }
  }

  .gc-name {
    font-size: 0.82rem;
    font-family: 'Libre Baskerville', serif;
    color: var(--cream);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .gc-tag {
    font-family: 'DM Mono', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.06em;
    padding: 1px 5px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .gc-tag-cut { background: rgba(139,32,32,0.2); color: var(--red-light); border: 1px solid rgba(139,32,32,0.3); }
  .gc-tag-wd  { background: rgba(100,100,100,0.2); color: #aaa; border: 1px solid rgba(100,100,100,0.3); }
  .gc-tag-win { font-size: 0.7rem; }
  .gc-tag-alt { background: rgba(201,168,76,0.1); color: var(--gold-light); border: 1px solid var(--border); }

  .gc-scores {
    display: grid;
    grid-template-columns: repeat(4, 30px) 34px;
    gap: 2px;
    flex-shrink: 0;
    align-items: center;
  }

  .gc-round {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    text-align: center;
    padding: 3px 2px;
    border-radius: 3px;
    min-width: 0;
    width: 100%;
    background: rgba(0,0,0,0.15);
  }

  .gc-round-empty { color: rgba(200,200,200,0.2); background: transparent; }

  .gc-total {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    text-align: center;
    padding: 3px 4px;
    border-radius: 3px;
    background: rgba(0,0,0,0.2);
    border-left: 1px solid rgba(201,168,76,0.15);
  }

  /* Column header row inside team card */
  .tc-col-headers {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 10px 2px;
    margin-bottom: 2px;

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  if (espnTimer) clearInterval(espnTimer);
  pollTimer = setInterval(syncPull, POLL_INTERVAL);
  espnTimer = setInterval(() => fetchESPN(activeMajorId).catch(() => {}), ESPN_POLL);
}

// ══════════════════════════════════════════
// JSONBIN
// ══════════════════════════════════════════
let lastHash = '';

async function syncPull() {
  try {
    const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': API_KEY }
    });
    if (!r.ok) { setSyncStatus('error'); return; }
    const j = await r.json();
    const raw = j.record;
    const h = JSON.stringify(raw);
    if (h !== lastHash) {
      lastHash = h;
      state = migrateState(raw);
      saveCache(raw);
      setSyncStatus('live');
      syncFailCount = 0;
      fetchESPN(activeMajorId).catch(() => {});
      renderMain(true);
    } else {
      setSyncStatus('live');
      syncFailCount = 0;
    }
  } catch(e) {
    syncFailCount++;
    if (syncFailCount >= 2) setSyncStatus('error');
    console.warn('syncPull failed:', e.message);
    if (state) renderMain(true);
  }
}

async function syncPush() {
  setSyncStatus('syncing');
  try {
    const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
      body: JSON.stringify(state)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    saveCache(state);
    setSyncStatus('live');
    showToast('Saved ✓');
    renderMain(true);
  } catch(e) {
    setSyncStatus('error');
    showToast('Save failed — check connection');
    console.warn('syncPush failed:', e.message);
  }
}

function migrateState(raw) {
  if (!raw || raw.init) raw = {};
  if (!raw.majors) raw.majors = {};
  MAJORS.forEach(m => {
    if (!raw.majors[m.id]) raw.majors[m.id] = {
      rosters: {},       // { playerName: { picks: [], alternate: '' } }
      statuses: {},      // { golferName: 'active'|'missed_cut'|'withdrawn'|'winner' }
      potExtra: {},      // { playerName: count of $5 additions }
      subs: {},          // { playerName: { slot: index, subOut: golferName, subIn: altName, paid: true } }
      complete: false,
      teamWinner: '',
      majorWinner: '',
    };
    PLAYERS.forEach(p => {
      if (!raw.majors[m.id].rosters[p]) raw.majors[m.id].rosters[p] = { picks: ['','','','',''], alternate: '' };
      if (!raw.majors[m.id].potExtra[p]) raw.majors[m.id].potExtra[p] = 0;
      if (!raw.majors[m.id].subs) raw.majors[m.id].subs = {};
    });
  });
  return raw;
}

// ══════════════════════════════════════════
// ESPN
// ══════════════════════════════════════════
async function fetchESPN(majorId) {
  const major = MAJORS.find(m => m.id === majorId);
  if (!major || !major.espnId) return;
  try {
    const url = `https://site.api.espn.com/apis/site/v2/sports/golf/leaderboard?event=${major.espnId}`;
    const r = await fetch(url);
    const j = await r.json();
    const competitors = j?.events?.[0]?.competitions?.[0]?.competitors || [];
    const scores = {};
    competitors.forEach(c => {
      const name = c.athlete?.displayName || '';
      if (!name) return;

      // to-par score: normalize '0' to 'E'
      let scoreDisp = c.score?.displayValue || 'E';
      if (scoreDisp === '0') scoreDisp = 'E';

      // Numeric to-par for summing team scores
      let toPar = 0;
      if (scoreDisp === 'E') toPar = 0;
      else { const n = parseInt(scoreDisp); toPar = isNaN(n) ? 0 : n; }

      // Position label (T2, 1, etc.)
      const pos = c.status?.position?.displayName || '';

      // Thru hole — ESPN stores as status.thru (int) or type.shortDetail ("F", "Thru 14")
      const thruRaw = c.status?.thru;
      const shortDetail = c.status?.type?.shortDetail || '';
      let thru = '';
      if (shortDetail === 'F' || shortDetail === 'F*') thru = 'F';
      else if (thruRaw != null && thruRaw !== '') thru = `${thruRaw}`;
      else if (shortDetail) thru = shortDetail;

      // Cut detection
      const statusId = c.status?.type?.id || '';
      const cut = statusId === 'cut' || shortDetail.toLowerCase().includes('cut');

      // Today's round score (last linescore entry)
      const todayVal = c.linescores?.slice(-1)?.[0]?.value ?? null;
      const todayDisp = todayVal != null
        ? (todayVal === 0 ? 'E' : (todayVal > 0 ? `+${todayVal}` : `${todayVal}`))
        : '';

      // Tee time — before round starts, ESPN puts tee time string in status.thru (e.g. "7:40 AM")
      const thruVal = c.status?.thru;
      const shortDetailVal = c.status?.type?.shortDetail || '';
      let teeTimeDisp = '';

      const etToCT = (timeStr) => {
        // Convert "10:20 AM" ET to CT by subtracting 1 hour
        const m = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
        if (!m) return timeStr + ' CT';
        let h = parseInt(m[1]), min = m[2], period = m[3].toUpperCase();
        // Convert to 24h, subtract 1, convert back
        if (period === 'PM' && h !== 12) h += 12;
        if (period === 'AM' && h === 12) h = 0;
        h -= 1; // ET -> CT
        if (h < 0) h += 24;
        const newPeriod = h >= 12 ? 'PM' : 'AM';
        const displayH = h > 12 ? h - 12 : (h === 0 ? 12 : h);
        return `${displayH}:${min} ${newPeriod} CT`;
      };

      if (typeof thruVal === 'string' && /\d+:\d+\s*(AM|PM)/i.test(thruVal)) {
        teeTimeDisp = etToCT(thruVal);
      } else if (/\d+:\d+\s*(AM|PM)/i.test(shortDetailVal)) {
        teeTimeDisp = etToCT(shortDetailVal);
      }
      if (!teeTimeDisp) {
        const teeTimeRaw = c.status?.teeTime || c.teeTime || null;
        if (teeTimeRaw) {
          try {
            const dt = new Date(teeTimeRaw);
            if (!isNaN(dt)) teeTimeDisp = dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'America/Chicago' }) + ' CT';
          } catch(e) {}
        }
      }

      const headshot = c.athlete?.headshot?.href || '';
      const country = c.athlete?.flag?.alt || c.athlete?.citizenship || '';
      const flagUrl = c.athlete?.flag?.href || '';
      // Extra profile info
      const birthDate = c.athlete?.dateOfBirth || c.athlete?.dob || '';
      const bp = c.athlete?.birthPlace || c.athlete?.birthplace || {};
      const birthPlace = [bp.city, bp.state, bp.country].filter(Boolean).join(', ');
      const age = birthDate ? Math.floor((Date.now() - new Date(birthDate)) / (365.25 * 24 * 3600 * 1000)) : null;
      const hand = c.athlete?.hand?.displayValue || c.athlete?.hand || '';
      const worldRank = c.statistics?.find(s => s.name === 'worldRanking')?.displayValue
        || c.statistics?.find(s => s.name === 'world_ranking')?.displayValue
        || c.athlete?.links?.find(l => l.rel?.includes('rank'))?.text || '';
      const earnings = c.statistics?.find(s => s.name === 'moneyList')?.displayValue
        || c.statistics?.find(s => s.name === 'earnings')?.displayValue || '';
      scores[name.toLowerCase()] = { score: scoreDisp, toPar, pos, thru, todayDisp, cut, teeTime: teeTimeDisp, headshot, country, flagUrl, birthDate, birthPlace, age, hand, worldRank, earnings, raw: c };
    });
    espnData[majorId] = scores;

    // If tournament is complete, snapshot scores into state for permanent display
    if (state?.majors?.[majorId]) {
      const mData = state.majors[majorId];
      const isComplete = mData.complete || mData.majorWinner;
      if (isComplete && (!mData.scoreSnapshot || Object.keys(mData.scoreSnapshot).length === 0)) {
        mData.scoreSnapshot = {};
        Object.entries(scores).forEach(([k, v]) => {
          mData.scoreSnapshot[k] = {
            score: v.score, toPar: v.toPar, thru: v.thru,
            linescores: v.raw?.linescores || [], flagUrl: v.flagUrl, country: v.country
          };
        });
        syncPush();
      }
    }

    if (majorId === activeMajorId) {
      setESPNStatus('live');
      renderMain(true); // preserve scroll on ESPN update
    }
  } catch(e) {
    setESPNStatus('error');
    console.warn('ESPN fetch failed', e);
  }
}

function getGolferScore(majorId, golferName) {
  // Use live data if available, otherwise fall back to stored snapshot
  let data = espnData[majorId];
  if (!data || Object.keys(data).length === 0) {
    const snap = state?.majors?.[majorId]?.scoreSnapshot;
    if (snap && Object.keys(snap).length > 0) data = snap;
  }
  if (!data) return null;
  const key = golferName.toLowerCase().trim();

  // 1. Exact match
  if (data[key]) return data[key];

  // 2. Normalize both sides: remove accents, dots, apostrophes
  const norm = s => s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // remove accents (Højgaard -> hojgaard)
    .replace(/[.'\u2019\u00f8]/g, '')  // remove dots/apostrophes, ø
    .replace(/ae/g, 'e').replace(/oe/g, 'e') // common Scandinavian substitutions
    .replace(/\s+/g, ' ').trim();

  const normKey = norm(golferName);
  for (const k of Object.keys(data)) {
    if (norm(k) === normKey) return data[k];
  }

  // 3. Last name exact match (only if unambiguous)
  const lastName = normKey.split(' ').pop();
  if (lastName.length > 3) {
    const lastMatches = Object.keys(data).filter(k => norm(k).split(' ').pop() === lastName);
    if (lastMatches.length === 1) return data[lastMatches[0]];
  }

  // 4. First + last name token match
  const keyTokens = normKey.split(' ');
  for (const k of Object.keys(data)) {
    const kTokens = norm(k).split(' ');
    if (keyTokens.every(t => kTokens.some(kt => kt.startsWith(t) || t.startsWith(kt)))) return data[k];
  }

  return null;
}

// ══════════════════════════════════════════
// POT CALC
// ══════════════════════════════════════════
function calcPot(majorId) {
  if (!state) return { base: 0, extra: 0, total: 0, half: 0 };
  const mData = state.majors[majorId];
  const base = PLAYERS.length * 20;
  let extra = 0;
  PLAYERS.forEach(p => { extra += (mData.potExtra[p] || 0) * 5; });
  // Add $10 per confirmed sub
  const subCount = Object.values(mData.subs || {}).filter(s => s?.paid).length;
  extra += subCount * 10;
  const total = base + extra;
  return { base, extra, total, half: total / 2 };
}

// ══════════════════════════════════════════
// TEAM SCORE CALC
// ══════════════════════════════════════════
function calcTeamScore(majorId, playerName) {
  if (!state) return { score: null, scorers: [] };
  const mData = state.majors[majorId];
  const roster = mData.rosters[playerName];
  if (!roster) return { score: null, scorers: [] };

  let total = 0;
  let hasAny = false;
  const scorers = [];

  const playerSub = mData.subs?.[playerName];

  roster.picks.forEach((g, slotIdx) => {
    if (!g) return;
    const status = mData.statuses[g] || 'active';

    // Withdrawn golfers don't count at all
    if (status === 'withdrawn') {
      scorers.push({ name: g, status, score: null });
      return;
    }

    // Check if this slot has been subbed — use alt from R2 onwards
    const sub = playerSub?.slot === slotIdx ? playerSub : null;

    let toPar = null;

    if (sub?.paid && sub?.subIn) {
      // Subbed: full score swap — use sub-in player's complete tournament score
      const altEspn = getGolferScore(majorId, sub.subIn);
      const getLS = e => e?.raw?.linescores || e?.linescores || [];
      const allLS = getLS(altEspn).slice(0, 4);
      if (allLS.length > 0) {
        toPar = allLS.reduce((s, r) => {
          const d = String(r.displayValue ?? '').trim();
          const n = d === 'E' ? 0 : parseInt(d);
          return s + (isNaN(n) ? 0 : (Math.abs(n) > 20 ? n - 72 : n));
        }, 0);
        hasAny = true;
      }
      scorers.push({ name: g, subIn: sub.subIn, isSubbed: true, status, score: toPar });
    } else {
      // Normal: sum all rounds
      const espn = getGolferScore(majorId, g);
      if (espn) {
        const ls = espn.raw?.linescores?.slice(0, 4) || espn.linescores?.slice(0, 4) || [];
        if (ls.length > 0) {
          toPar = ls.reduce((s, r) => {
            const d = String(r.displayValue ?? '').trim();
            const n = d === 'E' ? 0 : parseInt(d);
            return s + (isNaN(n) ? 0 : (Math.abs(n) > 20 ? n - 72 : n));
          }, 0);
        } else {
          toPar = espn.toPar ?? 0;
        }
        hasAny = true;
      }
      scorers.push({ name: g, status, score: toPar, espn });
    }

    if (toPar !== null) total += toPar;
  });

  return { score: hasAny ? total : null, scorers };
}

  const historyBtn = `<button class="tab${activeView==='history'?' active':''}" onclick="switchView('history')">

}

let activeView = 'major'; // 'major' | 'standings' | 'history'
let activeStandingsYear = 2026;

function switchMajor(id) {
  activeMajorId = id;
  activeView = 'major';
  renderTabs();
  setESPNStatus('pending');
  fetchESPN(id).catch(() => {});
  renderMain();
}

function switchView(view) {

function renderPayoutSummary(majorId) {

      return `<div class="payout-row">
        <span class="payout-label">${p}</span>
        <span class="payout-detail">${cutGolfers.join(', ')} missed cut</span>

    ...PLAYERS.filter(p => mData.subs?.[p]?.paid).map(p => {

        <span class="payout-label">${p}</span>
        <span class="payout-detail">${sub.subOut} → ${sub.subIn} (sub)</span>

    </div>`).join('') : '';

  const majorWinnerOwner = PLAYERS.find(p => mData.rosters[p]?.picks?.includes(mData.majorWinner));
  const majorWinnerRow = mData.majorWinner ? `
    <div class="payout-row payout-winner">
      <span class="payout-label">🏆 ${majorWinnerOwner || '–'}</span>
      <span class="payout-detail">Drafted ${mData.majorWinner}</span>
      <span class="payout-amount payout-pos">+$${pot.half.toFixed(2)}</span>
    </div>` : '';

  return `
    <div class="divider"></div>
    <div class="section-header"><span class="section-title">Payouts</span></div>
    <div class="payout-card">
      <div class="payout-pot-row">
        <div class="payout-pot-item">
          <div class="payout-pot-label">Total Pot</div>
          <div class="payout-pot-val">$${pot.total.toFixed(2)}</div>
        </div>
        <div class="payout-pot-item">
          <div class="payout-pot-label">Low Team Prize</div>
          <div class="payout-pot-val">$${pot.half.toFixed(2)}</div>
        </div>
        <div class="payout-pot-item">
          <div class="payout-pot-label">Major Winner Prize</div>
          <div class="payout-pot-val">$${pot.half.toFixed(2)}</div>
        </div>
        ${pot.extra ? `<div class="payout-pot-item">
          <div class="payout-pot-label">Penalties & Subs</div>
          <div class="payout-pot-val payout-neg">+$${pot.extra.toFixed(2)}</div>
        </div>` : ''}
      </div>
      ${penaltyRows || teamWinnerRow || majorWinnerRow ? `
        <div class="payout-divider"></div>
        ${penaltyRows}
        ${teamWinnerRow}
        ${majorWinnerRow}
      ` : `<div class="payout-empty">Payouts will appear here as the tournament progresses</div>`}

  `;
}

function renderAltCard(alt, isSubIn = false) {
  const espn = getGolferScore(activeMajorId, alt);
  const live = isTournamentLive(activeMajorId) || Object.keys(espnData[activeMajorId] || {}).length > 0;
  const week = isTournamentWeek(activeMajorId);
  const ls = espn?.raw?.linescores?.slice(0,4) || [];
  const thru = espn?.thru || '';
  const sd = espn?.raw?.status?.type?.shortDetail || '';

  // Use identical logic to main golfer cards
  const altRounds = [];
  ls.slice(0,4).forEach(r => {
    const disp = String(r.displayValue ?? '').trim();
    const n = disp === 'E' ? 0 : parseInt(disp);
    const tp = isNaN(n) ? null : (Math.abs(n) > 20 ? n - 72 : n);
    if (tp !== null) altRounds.push(tp);
  });

  const thruStr = String(thru);
  const altFinal = thruStr === 'F' || sd === 'F' || sd === 'F*';
  const altLastPlayed = altRounds.length - 1;

  let roundCells = '';
  if (live && altRounds.length > 0) {
    roundCells = [0,1,2,3].map(r => {
      if (altRounds[r] === undefined) return '<span class="gc-round gc-round-empty">–</span>';
      const cls = altRounds[r] < 0 ? 'score-under' : altRounds[r] > 0 ? 'score-over' : 'score-even';
      const isLast = r === altLastPlayed;
      const sub = isLast && altFinal
        ? '<span class="gc-round-sub" style="opacity:0.5">F</span>'
        : isLast && thruStr && thruStr !== '0' && thruStr !== 'F'
        ? '<span class="gc-round-sub">H' + thruStr + '</span>'
        : '';
      const active = isLast && !altFinal ? ' gc-round-active' : '';
      return '<span class="gc-round ' + cls + active + '">' + (altRounds[r] === 0 ? 'E' : (altRounds[r] > 0 ? '+' : '') + altRounds[r]) + sub + '</span>';
    }).join('');
  } else {
    roundCells = '<span class="gc-round gc-round-empty" style="grid-column:span 4">–</span>';
  }

  let totStr = null, totCls = '';
  if (live && altRounds.length > 0) {
    const sum = altRounds.reduce((s, r) => s + r, 0);
    totStr = sum === 0 ? 'E' : (sum > 0 ? '+' + sum : '' + sum);
    totCls = sum < 0 ? 'score-under' : sum > 0 ? 'score-over' : 'score-even';
  }

  const flag = espn?.flagUrl
    ? '<img src="' + espn.flagUrl + '" alt="" style="width:14px;height:10px;object-fit:cover;border-radius:1px;flex-shrink:0" onerror="this.remove()">'
    : '';
  const teeTime = espn?.teeTime && week && (!thru || thru === '' || thru === '0')
    ? '<div class="gc-tee-time">⏰ ' + espn.teeTime + '</div>'
    : '';

  // Leader badge check — same logic as main golfer cards
  const altLS = espn?.raw?.linescores?.slice(0,4) || espn?.linescores?.slice(0,4) || [];
  const altScore = live && altLS.length > 0
    ? altLS.reduce((s, r) => { const d=String(r.displayValue??'').trim(); const n=d==='E'?0:parseInt(d); return s+(isNaN(n)?0:(Math.abs(n)>20?n-72:n)); }, 0)
    : null;
  const isAltLeader = live && minGolferScore !== null && altScore === minGolferScore;
  const leaderTag = isAltLeader ? ' 🏆' : '';


  return '<div class="' + (isSubIn ? 'golfer-card' : 'golfer-card gc-alt') + '">'
    + '<div class="gc-name-row"><div style="min-width:0;overflow:hidden">'
    + '<div style="display:flex;align-items:center;gap:4px;flex-wrap:nowrap;min-width:0">'
    + flag
    + '<span class="gc-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis' + (isAltLeader ? ';color:var(--gold);font-weight:700' : '') + '">' + alt + leaderTag + '</span>'
    + (isSubIn ? '<span class="gc-tag" style="background:rgba(201,168,76,0.2);color:var(--gold);border-color:var(--gold)">SUB</span>' : '<span class="gc-tag gc-tag-alt">ALT</span>')
    + '</div>' + teeTime + '</div></div>'
    + '<div class="gc-scores">' + roundCells
    + '<span class="gc-total ' + totCls + '" style="opacity:0.7">' + (totStr || '–') + '</span>'
    + '</div></div>';
}

function renderMain(preserveScroll = false) {
  if (!state) return;
  if (activeView === 'history') { renderHistory(); return; }
  if (activeView === 'standings') { renderStandings(); return; }
  // Don't auto-switch major tabs during background sync — respect what user is viewing
  // (activeMajorId is only changed by user tab clicks or initial load)
  const scrollY = preserveScroll ? window.scrollY : 0;
  const major = MAJORS.find(m => m.id === activeMajorId);
  const mData = state.majors[activeMajorId];
  const pot = calcPot(activeMajorId);
  const hasRosters = PLAYERS.some(p => mData.rosters[p]?.picks?.some(g => g));
  const hasSnapshot = Object.keys(espnData[activeMajorId] || {}).length > 0;
  const live = isTournamentLive(activeMajorId) || hasSnapshot;

  // Status badge
  const now = new Date();
  const startDates = { masters2026: new Date('2026-04-09'), pga2026: new Date('2026-05-14'), usopen2026: new Date('2026-06-18'), theopen2026: new Date('2026-07-16') };
  const endDates   = { masters2026: new Date('2026-04-13T23:59:00'), pga2026: new Date('2026-05-17T23:59:00'), usopen2026: new Date('2026-06-21T23:59:00'), theopen2026: new Date('2026-07-19T23:59:00') };
  let statusBadge = '';
  if (now < (startDates[activeMajorId] || Infinity)) statusBadge = `<span class="round-badge round-upcoming">Upcoming · ${major.dates}</span>`;
  else if (now > (endDates[activeMajorId] || 0) || mData.complete) statusBadge = `<span class="round-badge round-complete">Complete</span>`;
  else statusBadge = `<span class="round-badge round-live">● Live</span>`;

  let html = '';

  // ── HERO ──
  html += `
    <div class="major-hero">
      <div class="major-info">
        <h2>${major.name}</h2>
        <div class="major-meta">${major.year} &nbsp;·&nbsp; ${major.course} &nbsp;·&nbsp; ${major.dates} &nbsp;&nbsp;${statusBadge}</div>
      </div>
      <div class="pot-display">
        <div class="pot-amount">$${pot.total.toFixed(2)}</div>
        <div class="pot-label">Total Pot</div>
        <div class="pot-breakdown">$${pot.half.toFixed(2)} low team · $${pot.half.toFixed(2)} major winner${pot.extra ? ` · +$${pot.extra.toFixed(2)} penalties & subs` : ''}</div>
      </div>
    </div>
  `;

  // ── WINNER BANNERS ──
  if (mData.majorWinner) {
    html += `<div class="winner-banner"><div class="winner-trophy">🏆</div><div class="winner-text"><h3>Major Champion: ${mData.majorWinner}</h3><p>Drafted by ${PLAYERS.find(p => mData.rosters[p]?.picks?.includes(mData.majorWinner)) || 'unknown'} · $${pot.half.toFixed(2)} prize</p></div></div>`;
  }
  if (mData.teamWinner) {
    const twList = mData.teamWinner.split(',').map(s=>s.trim()).filter(Boolean);
    const twLabel = twList.join(' & ');
    const twPrize = Math.round(pot.half / twList.length * 100) / 100;
    html += `<div class="winner-banner"><div class="winner-trophy">🥇</div><div class="winner-text"><h3>Low Team: ${twLabel}</h3><p>Best combined score · $${twPrize.toFixed(2)} prize${twList.length > 1 ? " each" : ""}</p></div></div>`;
  }

  if (!hasRosters) {
    html += `<div class="empty-state"><p>Draft not yet entered — use Admin to set rosters</p></div>`;
    document.getElementById('mainContent').innerHTML = html;
    return;
  }

  // ── BUILD TEAM SCORES ──
  const teamScores = PLAYERS.map(p => {
    const ts = calcTeamScore(activeMajorId, p);
    const missedCount = mData.rosters[p]?.picks?.filter(g => g && mData.statuses[g] === 'missed_cut').length || 0;
    return { player: p, ...ts, missedCount };
  }).sort((a, b) => {
    if (a.score === null && b.score === null) return 0;
    if (a.score === null) return 1;
    if (b.score === null) return -1;
    if (a.score !== b.score) return a.score - b.score;
    // Tiebreaker: lowest individual golfer score on each team
    const bestScore = (player) => {
      const picks = mData.rosters[player]?.picks || [];
      const sub = mData.subs?.[player];
      // Build effective roster: replace subbed-out pick with sub-in
      const effectivePicks = picks.map((g, i) => {
        if (sub?.paid && sub.slot === i && sub.subIn) return sub.subIn;
        return g;
      });
      // Also consider the alt if not used as sub
      const alt = mData.rosters[player]?.alternate;
      const allGolfers = [...effectivePicks, ...(alt && !sub?.paid ? [alt] : [])];
      const scores = allGolfers.map(g => {
        if (!g) return null;
        const espn = getGolferScore(activeMajorId, g);
        if (!espn) return null;
        const ls = espn.raw?.linescores?.slice(0,4) || espn.linescores?.slice(0,4) || [];
        if (!ls.length) return null;
        return ls.reduce((s, r) => { const d=String(r.displayValue??'').trim(); const n=d==='E'?0:parseInt(d); return s+(isNaN(n)?0:(Math.abs(n)>20?n-72:n)); }, 0);
      }).filter(s => s !== null);
      return scores.length ? Math.min(...scores) : 0;
    };
    return bestScore(a.player) - bestScore(b.player);
  });

  // ── TEAM CARDS GRID ──
  html += `<div class="team-cards-grid">`;

  // Find the lowest individual golfer score across all teams (tournament leader)
  minGolferScore = null;
  if (live) {
    // Find the actual tournament leader score from ALL ESPN data (not just drafted)
    const allEspnData = espnData[activeMajorId] || {};
    Object.values(allEspnData).forEach(espnG => {
      const ls = espnG?.raw?.linescores?.slice(0,4) || espnG?.linescores?.slice(0,4) || [];
      if (!ls.length) return;
      const score = ls.reduce((s, r) => {
        const d = String(r.displayValue ?? '').trim();
        const n = d === 'E' ? 0 : parseInt(d);
        return s + (isNaN(n) ? 0 : (Math.abs(n) > 20 ? n - 72 : n));
      }, 0);
      if (minGolferScore === null || score < minGolferScore) minGolferScore = score;
    });
  }

  teamScores.forEach((ts, rank) => {
    const roster = mData.rosters[ts.player];
    const picks = roster?.picks || [];
    const alt = roster?.alternate || '';
    const isLeader = rank === 0 && ts.score !== null;
    const potAdd = ((mData.potExtra[ts.player] || 0) * 5)
      + (mData.subs?.[ts.player]?.paid ? 10 : 0);

    const scoreDisp = live && ts.score !== null
      ? `<span class="tc-score ${ts.score < 0 ? 'score-under' : ts.score > 0 ? 'score-over' : 'score-even'}">${ts.score === 0 ? 'E' : (ts.score > 0 ? '+' : '') + ts.score}</span>`
      : `<span class="tc-score-dash">–</span>`;

    html += `
      <div class="team-card${isLeader ? ' team-card-leader' : ''}">
        <div class="tc-header">
          <div class="tc-rank-name">
            <span class="tc-rank${isLeader ? ' tc-rank-gold' : ''}">${rank + 1}</span>
            <span class="tc-name">${ts.player}</span>
          </div>
          <div class="tc-total" style="display:flex;align-items:center;gap:8px">
            ${scoreDisp}
            ${potAdd > 0 ? `<span style="font-size:0.68rem;background:rgba(255,80,80,0.15);color:#ff5555;border:1px solid rgba(255,80,80,0.35);padding:2px 6px;border-radius:4px;font-family:'DM Mono',monospace;font-weight:700">+$${potAdd.toFixed(2)}</span>` : ''}
          </div>
        </div>
        <div class="tc-golfers">
          <div class="tc-col-headers">
            <span class="tc-col-left">Golfer</span>
            <div class="tc-col-rounds">
              <span>R1</span><span>R2</span><span>R3</span><span>R4</span><span>TOT</span>
            </div>
          </div>
          ${picks.map(g => {
            if (!g) return '';
            const status = mData.statuses[g] || 'active';
            const isCut = status === 'missed_cut';
            const isWD = status === 'withdrawn';
            // Check if this golfer has been subbed out
            const _ownerOfG = Object.keys(mData.rosters).find(p => mData.rosters[p]?.picks?.includes(g));
            const _subData = _ownerOfG ? mData.subs?.[_ownerOfG] : null;
            const isSubbedOut = _subData?.paid && _ownerOfG && mData.rosters[_ownerOfG]?.picks?.[_subData.slot] === g;
            const isWinner = mData.majorWinner === g;
            const espnG = getGolferScore(activeMajorId, g);
            const golferLS = espnG?.raw?.linescores?.slice(0,4) || [];
            // Leader badge: check the actual golfer's score directly
            const _leaderEspn = getGolferScore(activeMajorId, g);
            const _leaderLS = _leaderEspn?.raw?.linescores?.slice(0,4) || _leaderEspn?.linescores?.slice(0,4) || [];
            const golferScore = live && _leaderLS.length > 0
              ? _leaderLS.reduce((s, r) => { const d = String(r.displayValue??'').trim(); const n=d==='E'?0:parseInt(d); return s+(isNaN(n)?0:(Math.abs(n)>20?n-72:n)); }, 0)
              : null;
            const isGolferLeader = live && minGolferScore !== null && golferScore === minGolferScore;

            // Per-round scores — read directly from ESPN's linescores array
            // Each linescore entry is one ROUND (not one hole) for the leaderboard API
            const linescores = espnG?.raw?.linescores || [];
            const rounds = [];
            linescores.forEach((ls, r) => {
              if (r >= 4) return;
              // displayValue is the round score e.g. "-5", "+2", "E", "67", "72"
              const disp = ls.displayValue || ls.value;
              if (disp === undefined || disp === null || disp === '') return;
              // ESPN sometimes gives stroke total (e.g. 67), sometimes gives to-par (e.g. -5)
              // The value field is strokes, displayValue is to-par relative to round par
              const dispStr = String(disp);
              let toPar;
              if (dispStr === 'E') toPar = 0;
              else {
                const n = parseInt(dispStr);
                if (!isNaN(n)) {
                  // If it looks like a full round score (65-80 range), convert to to-par
                  if (Math.abs(n) > 20) {
                    const roundPar = 72; // Augusta is par 72
                    toPar = n - roundPar;
                  } else {
                    toPar = n;
                  }
                }
              }
              if (toPar !== undefined) rounds.push(toPar);
            });

            let overallScore = null;
            if (live && espnG) {
              if (rounds.length > 0) {
                const sumToPar = rounds.reduce((s, r) => s + r, 0);
                overallScore = sumToPar === 0 ? 'E' : (sumToPar > 0 ? '+' + sumToPar : String(sumToPar));
              } else {
                overallScore = espnG.score === '0' ? 'E' : espnG.score;
              }
            }
            const overallCls = overallScore ? (overallScore.startsWith('-') ? 'score-under' : overallScore.startsWith('+') ? 'score-over' : overallScore === 'E' ? 'score-even' : '') : '';

            let statusTag = '';
            if (isSubbedOut && isCut) statusTag = '<span class="gc-tag" style="background:rgba(201,168,76,0.15);color:var(--gold);border-color:rgba(201,168,76,0.4);font-size:0.55rem">OUT</span><span class="gc-tag gc-tag-cut" style="margin-left:2px">MC</span>';
            else if (isSubbedOut && isWD) statusTag = '<span class="gc-tag" style="background:rgba(201,168,76,0.15);color:var(--gold);border-color:rgba(201,168,76,0.4);font-size:0.55rem">OUT</span><span class="gc-tag gc-tag-wd" style="margin-left:2px">WD</span>';
            else if (isCut) statusTag = '<span class="gc-tag gc-tag-cut">MC</span>';
            else if (isWD) statusTag = '<span class="gc-tag gc-tag-wd">WD</span>';
            else if (isSubbedOut) statusTag = '<span class="gc-tag" style="background:rgba(201,168,76,0.15);color:var(--gold);border-color:rgba(201,168,76,0.4);font-size:0.55rem">OUT</span>';
            else if (isWinner) statusTag = '<span class="gc-tag gc-tag-win">🏆</span>';

            const teeTimeStr = espnG?.teeTime || '';

            // Which round is currently active for this player?
            const activeRound = espnG?.raw?.linescores?.length
              ? Math.min(espnG.raw.linescores.length - 1, 3)
              : -1;
            const thruRaw = espnG?.thru || '';  // "7", "F", "0", ""
            const isFinal = thruRaw === 'F';

            // Sub-text under the last played round: hole number or F
            const lastPlayedRound = rounds.length - 1;
            const roundCells = live ? [0,1,2,3].map(r => {
              if (rounds[r] === undefined) return `<span class="gc-round gc-round-empty">–</span>`;
              const cls = rounds[r] < 0 ? 'score-under' : rounds[r] > 0 ? 'score-over' : 'score-even';
              const isLast = r === lastPlayedRound;
              const subText = isLast && isFinal
                ? `<span class="gc-round-sub" style="opacity:0.5">F</span>`
                : isLast && thruRaw && thruRaw !== '0' && thruRaw !== 'F'
                ? `<span class="gc-round-sub">H${thruRaw}</span>`
                : '';
              return `<span class="gc-round ${cls}${isLast && !isFinal ? ' gc-round-active' : ''}">${rounds[r] === 0 ? 'E' : (rounds[r] > 0 ? '+' : '') + rounds[r]}${subText}</span>`;
            }).join('') : '<span class="gc-round gc-round-empty" style="grid-column:span 4">–</span>';

            const thruDisp = '';
            return `
              <div class="golfer-card${isCut ? ' gc-cut' : isWD ? ' gc-wd' : isSubbedOut ? ' gc-alt' : ''}">
                <div class="gc-name-row">
                  <div style="min-width:0;overflow:hidden">
                    <div style="display:flex;align-items:center;gap:4px;flex-wrap:nowrap;min-width:0">

                      ${statusTag}
                    </div>
                    ${teeTimeStr && isTournamentWeek(activeMajorId) && (!espnG?.thru || espnG.thru === '' || espnG.thru === '0') ? `<div class="gc-tee-time">⏰ ${teeTimeStr}</div>` : ''}


                  </div>
                </div>
                <div class="gc-scores">
                  ${roundCells}
                  <span class="gc-total ${overallCls}">${live && overallScore ? (overallScore === '0' ? 'E' : overallScore) : '–'}</span>
                </div>
              </div>
              ${(() => {
                // Show sub-in golfer row if this golfer's slot was subbed
                const ownerEntry = Object.entries(mData.rosters).find(([p, r]) => r?.picks?.includes(g));
                if (!ownerEntry) return '';
                const [owner] = ownerEntry;
                const s = mData.subs?.[owner];
                if (!s?.paid || mData.rosters[owner]?.picks?.[s.slot] !== g) return '';
                return renderAltCard(s.subIn, true); // true = subIn mode
              })()}
            `;
          }).filter(Boolean).join('')}
          ${alt ? (() => {
              // If alt is the active sub-in, show as SUB row instead of ALT
              const owner = Object.keys(mData.rosters).find(p => mData.rosters[p]?.alternate === alt && mData.rosters[p]?.picks?.some(g => g));
              const sub = owner ? mData.subs?.[owner] : null;
              const isActiveSub = sub?.paid && sub?.subIn === alt;
              return isActiveSub ? '' : renderAltCard(alt, false);
            })() : ''}
        </div>
      </div>
    `;
  });

  html += `</div>`;

  // ── PAYOUT SUMMARY ──
  html += renderPayoutSummary(activeMajorId);

  document.getElementById('mainContent').innerHTML = html;
  if (scrollY) window.scrollTo({ top: scrollY, behavior: 'instant' });
}


function renderOverallStandings() {
  const totals = {};
  PLAYERS.forEach(p => { totals[p] = { net: 0, majors: {} }; });

  MAJORS.forEach(m => {
    const mData = state.majors[m.id];
    const pot = calcPot(m.id);
    PLAYERS.forEach(p => {
      const paid = 20 + (mData.potExtra[p] || 0) * 5;
      let won = 0;
      const twSplit = mData.teamWinner ? mData.teamWinner.split(',').map(s=>s.trim()) : [];
      if (twSplit.includes(p)) won += Math.round(pot.half / twSplit.length * 100) / 100;
      const roster = mData.rosters[p];
      if (mData.majorWinner && roster?.picks?.includes(mData.majorWinner)) won += pot.half;
      totals[p].net += (won - paid);
      totals[p].majors[m.id] = won - paid;
    });
  });

  const sorted = PLAYERS.slice().sort((a,b) => totals[b].net - totals[a].net);

  let html = `
    <div class="standings-card">
      <table class="overall-table">
        <thead>
          <tr>
            <th>Player</th>
            ${MAJORS.map(m => `<th class="major-col-header">${m.name.replace('The ','').replace(' Championship','')}</th>`).join('')}
            <th>Net</th>
          </tr>
        </thead>
        <tbody>
  `;

  sorted.forEach(p => {
    html += `<tr>
      <td>${p}</td>
      ${MAJORS.map(m => {
        const v = totals[p].majors[m.id];
        const cls = v > 0 ? 'amount-positive' : v < 0 ? 'amount-negative' : '';
        return `<td class="${cls}">${v > 0 ? '+' : ''}$${v}</td>`;
      }).join('')}
      <td class="${totals[p].net > 0 ? 'amount-positive' : totals[p].net < 0 ? 'amount-negative' : ''}" style="font-weight:700">${totals[p].net > 0 ? '+$' : totals[p].net < 0 ? '-$' : '$'}${Math.abs(totals[p].net).toFixed(2)}</td>
    </tr>`;
  });

  html += `</tbody></table></div></div>`;
  return html;
}

  document.getElementById('adminModal').style.display = 'none';

function renderSubsAdmin() {
  const mData = state.majors[activeMajorId];
  if (!mData) return '';
  const mono = "font-family:'DM Mono',monospace";
  const serif = "font-family:'Libre Baskerville',serif";
  return PLAYERS.map(p => {
    const roster = mData.rosters[p];
    const alt = roster?.alternate || '';
    const sub = mData.subs?.[p];
    if (!alt) return `<div style="${mono};font-size:0.65rem;color:rgba(200,200,200,0.3);padding:4px 0">${p} — no alt set</div>`;

    let inner = '';
    if (sub?.paid) {
      inner = `<span style="${mono};font-size:0.65rem;color:#5dcc61">✓ ${sub.subOut} → ${sub.subIn}</span>`
        + ` <button class="btn btn-outline btn-sm" style="font-size:0.6rem;padding:3px 8px" onclick="removeSub('${p}')">Undo</button>`;
    } else {
      const opts = '<option value="">Sub out...</option>'
        + (roster?.picks || []).map((g, i) => g ? `<option value="${i}" ${sub?.slot === i ? 'selected' : ''}>${g}</option>` : '').join('');
      inner = `<select onchange="setSubSlot('${p}', this.value)" style="font-size:0.7rem;padding:3px">${opts}</select>`;
      if (sub?.slot !== undefined && !sub?.paid) {
        inner += ` <button class="btn btn-sm" style="background:var(--gold);color:var(--green-deep);font-size:0.65rem;padding:4px 10px" onclick="confirmSub('${p}')">Confirm +$10</button>`;
      }
    }

    return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--border)">
      <span style="${serif};font-size:0.8rem;color:var(--cream);min-width:70px">${p}</span>
      <span style="${mono};font-size:0.62rem;color:var(--gold-light);opacity:0.6">ALT: ${alt}</span>
      ${inner}
    </div>`;
  }).join('');
}

function setSubSlot(player, slotStr) {
  const mData = state.majors[activeMajorId];
  if (!mData.subs) mData.subs = {};
  if (slotStr === '') {
    delete mData.subs[player];
  } else {
    const slot = parseInt(slotStr);
    const alt = mData.rosters[player]?.alternate || '';
    mData.subs[player] = { slot, subOut: mData.rosters[player].picks[slot], subIn: alt, paid: false };
  }
  renderAdmin();
}

function confirmSub(player) {
  const mData = state.majors[activeMajorId];
  if (!mData.subs?.[player]) return;
  mData.subs[player].paid = true;
  syncPush();
  renderAdmin();
}

function removeSub(player) {
  const mData = state.majors[activeMajorId];
  if (!mData.subs) return;
  delete mData.subs[player];
  syncPush();
  renderAdmin();
}

function toggleTeamWinner(player, checked) {
  const mData = state.majors[activeMajorId];
  const winners = mData.teamWinner ? mData.teamWinner.split(',').map(s=>s.trim()).filter(Boolean) : [];
  if (checked && !winners.includes(player)) winners.push(player);
  if (!checked) winners.splice(winners.indexOf(player), 1);
  mData.teamWinner = winners.join(',');
}

function saveRosters() { syncPush(); }

function updateStatus(golfer, owner, status) {
  state.majors[activeMajorId].statuses[golfer] = status;
  // Auto-sync pot penalties
  if (owner && (status === 'missed_cut' || status === 'withdrawn')) {
    // Count how many of this player's picks are cut/withdrawn
    const picks = state.majors[activeMajorId].rosters[owner]?.picks || [];
    const cutCount = picks.filter(g => g && (state.majors[activeMajorId].statuses[g]==='missed_cut'||state.majors[activeMajorId].statuses[g]==='withdrawn')).length;
    state.majors[activeMajorId].potExtra[owner] = cutCount;
  } else if (owner && status === 'active') {
    const picks = state.majors[activeMajorId].rosters[owner]?.picks || [];
    const cutCount = picks.filter(g => g && (state.majors[activeMajorId].statuses[g]==='missed_cut'||state.majors[activeMajorId].statuses[g]==='withdrawn')).length;
    state.majors[activeMajorId].potExtra[owner] = cutCount;
  }
  syncPush();
}

function adjPot(player, delta) {
  const cur = state.majors[activeMajorId].potExtra[player] || 0;
  state.majors[activeMajorId].potExtra[player] = Math.max(0, cur + delta);
  syncPush();
}

function saveWinners() {
  // Also mark winner status on golfer
  const winner = state.majors[activeMajorId].majorWinner;
  if (winner) state.majors[activeMajorId].statuses[winner] = 'winner';
  syncPush();
}
